name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-gates:
    name: repository-gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m pip install ".[qc,test,freeze,evidence]"

      - name: Build and install wheel
        run: |
          python -m build
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -m pip check

      - name: Run tests
        run: python -m pytest -q

      - name: Verify tool discovery
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys

          payload = subprocess.check_output(
              [sys.executable, "-m", "bridge.toolkit.cli", "list", "--json"],
              text=True,
          )
          tools = json.loads(payload)
          if len(tools) != 12:
              raise SystemExit(f"expected 12 discoverable tools, found {len(tools)}")
          print("discoverable_tool_count=12")
          PY

      - name: Validate knowledge snapshot
        run: python -m bridge.toolkit.cli knowledge validate

      - name: Check repository policy
        run: python scripts/check_repository.py

      - name: Check committed whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$BASE_SHA...HEAD"
          else
            git diff --check "$BEFORE_SHA...HEAD"
          fi
