sample_unit_limitations:
  - The primary matrices reconcile exactly to the publication's 6-week, 8-week and 11-week analysis totals, but the 11-week group consists of two GEO samples with distinct age labels and BioSample records.
  - The cultured matrices reconcile to Table S1 only as provisional groups; GSM5746439 and GSM5746445 have two unresolved assignments because public metadata are incomplete or conflicting.
