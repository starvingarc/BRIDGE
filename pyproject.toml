[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bridge"
version = "0.2.0.dev0"
description = "Evidence-grounded scientific agent for cell-therapy product evaluation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "jsonschema>=4.23,<5",
  "scikit-learn>=1.5,<2",
  "scipy>=1.14,<2",
]

[project.optional-dependencies]
qc = [
  "anndata>=0.11,<0.13",
  "h5py>=3.11,<4",
  "matplotlib>=3.9,<4",
  "pyarrow>=18,<24",
  "scanpy>=1.10,<1.12",
  "scrublet>=0.2.3,<0.3",
]
test = [
  "pytest>=8,<10",
]
freeze = [
  "anndata>=0.11,<0.13",
  "cryptography>=46,<47",
  "h5py>=3.11,<4",
  "pyarrow>=18,<24",
]
evidence = [
  "networkx>=3.5,<3.6",
  "pyarrow>=21,<22",
  "regex>=2025.7,<2027",
]
target-regional = [
  "anndata>=0.11,<0.13",
  "decoupler>=2.1,<2.2",
]
developmental = [
  "anndata>=0.11,<0.13",
  "decoupler>=2.1,<2.2",
  "patsy>=1.0,<1.1",
  "statsmodels>=0.14,<0.15",
]

[project.scripts]
bridge-tool = "bridge.toolkit.cli:main"
bridge-reference = "bridge.tool_packages.p0_02_cell_state.reference_cli:main"
bridge-benchmark = "bridge.tool_packages.p0_02_cell_state.benchmark_cli:main"

[project.urls]
Repository = "https://github.com/starvingarc/BRIDGE"
Documentation = "https://github.com/starvingarc/BRIDGE/tree/main/docs"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"bridge.tool_packages.specs" = ["*.yaml"]
"bridge.tool_packages.cards" = ["*.md"]
"bridge.tool_packages.p0_02_cell_state" = ["*.R"]
"bridge.tool_packages.p0_01_input_qc.measurement_specs" = ["*.yaml"]
"bridge.tool_packages.p0_02_cell_state.measurement_specs" = ["*.yaml"]
"bridge.tool_packages.p0_02_cell_state.resources" = ["*.yaml"]
"bridge.tool_packages.p0_08_evidence_sufficiency.resources" = ["*.json"]
"bridge.tool_packages.p0_10_claim_verifier.resources" = ["*.json"]
"bridge.resources" = ["*.json.gz"]
"bridge.resources.schemas" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
