<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">BRIDGE development progress</title>
  <desc id="desc">Two-track progress view. Product engineering has completed packaging all 12 callable P0 tools, with Agent orchestration next and the Web workspace and interactive reports planned. Scientific readiness remains in progress: biological review is active, ScoreContracts are not frozen, and formal scientific release is not available.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7C8884"/>
    </marker>
    <filter id="shadow" x="-8%" y="-14%" width="116%" height="132%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#20332E" flood-opacity="0.10"/>
    </filter>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #172521; }
      .title { font-size: 27px; font-weight: 700; }
      .subtitle { font-size: 15.5px; font-weight: 500; fill: #52605C; }
      .track { font-size: 17px; font-weight: 700; letter-spacing: 1.1px; fill: #52605C; }
      .status { font-size: 13.5px; font-weight: 700; letter-spacing: 0.6px; }
      .card-title { font-size: 24px; font-weight: 700; }
      .card-subtitle { font-size: 16px; font-weight: 500; fill: #4D5C57; }
      .connector { stroke: #7C8884; stroke-width: 2.5; stroke-linecap: round; marker-end: url(#arrow); }
      .legend { font-size: 13.5px; font-weight: 600; fill: #52605C; }
    </style>
  </defs>

  <rect width="900" height="500" rx="20" fill="#F7FAF9"/>
  <text x="450" y="39" text-anchor="middle" class="title">BRIDGE development progress</text>
  <text x="450" y="64" text-anchor="middle" class="subtitle">Product engineering and scientific readiness advance on separate tracks</text>

  <text x="20" y="103" class="track">PRODUCT ENGINEERING</text>

  <line x1="294" y1="175" x2="306" y2="175" class="connector"/>
  <line x1="589" y1="175" x2="601" y2="175" class="connector"/>

  <g filter="url(#shadow)" aria-label="P0 tools complete">
    <rect x="20" y="120" width="270" height="116" rx="12" fill="#DDEFEA" stroke="#2E7B70" stroke-width="1.6"/>
    <circle cx="48" cy="148" r="13" fill="#2E7B70"/>
    <path d="M 42 148 L 47 153 L 55 143" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="70" y="153" class="status" fill="#23675E">COMPLETE</text>
    <text x="42" y="193" class="card-title">12/12 P0 tools</text>
    <text x="42" y="218" class="card-subtitle">Packaged &amp; callable</text>
  </g>

  <g filter="url(#shadow)" aria-label="Agent orchestration next">
    <rect x="315" y="120" width="270" height="116" rx="12" fill="#EEEAF8" stroke="#7867A6" stroke-width="1.6"/>
    <circle cx="343" cy="148" r="13" fill="#7867A6"/>
    <path d="M 340 142 L 349 148 L 340 154 Z" fill="#FFFFFF"/>
    <text x="365" y="153" class="status" fill="#65548F">NEXT</text>
    <text x="337" y="193" class="card-title">Agent orchestration</text>
    <text x="337" y="218" class="card-subtitle">Case and tool coordination</text>
  </g>

  <g filter="url(#shadow)" aria-label="Web workspace and interactive reports planned">
    <rect x="610" y="120" width="270" height="116" rx="12" fill="#F1F3F2" stroke="#9AA6A2" stroke-width="1.6"/>
    <circle cx="638" cy="148" r="13" fill="#9AA6A2"/>
    <circle cx="638" cy="148" r="4" fill="#FFFFFF"/>
    <text x="660" y="153" class="status" fill="#687470">PLANNED</text>
    <text x="632" y="193" class="card-title">Web &amp; reports</text>
    <text x="632" y="218" class="card-subtitle">Interactive research workspace</text>
  </g>

  <text x="20" y="286" class="track">SCIENTIFIC READINESS</text>

  <line x1="294" y1="358" x2="306" y2="358" class="connector"/>
  <line x1="589" y1="358" x2="601" y2="358" class="connector"/>

  <g filter="url(#shadow)" aria-label="Biological review in progress">
    <rect x="20" y="303" width="270" height="116" rx="12" fill="#FFF0C9" stroke="#B18A2E" stroke-width="1.6"/>
    <circle cx="48" cy="331" r="13" fill="#C08C2E"/>
    <path d="M 48 322 A 9 9 0 0 1 57 331" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <text x="70" y="336" class="status" fill="#8C681F">IN PROGRESS</text>
    <text x="42" y="376" class="card-title">Biological review</text>
    <text x="42" y="401" class="card-subtitle">Candidate/shadow methods</text>
  </g>

  <g filter="url(#shadow)" aria-label="ScoreContracts not frozen">
    <rect x="315" y="303" width="270" height="116" rx="12" fill="#F7F3E8" stroke="#B59B61" stroke-width="1.6"/>
    <circle cx="343" cy="331" r="13" fill="#B59B61"/>
    <path d="M 337 331 H 349" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/>
    <text x="365" y="336" class="status" fill="#806C3F">NOT FROZEN</text>
    <text x="337" y="376" class="card-title">ScoreContracts</text>
    <text x="337" y="401" class="card-subtitle">All domain scores remain null</text>
  </g>

  <g filter="url(#shadow)" aria-label="Formal scientific release not available">
    <rect x="610" y="303" width="270" height="116" rx="12" fill="#F1F3F2" stroke="#9AA6A2" stroke-width="1.6"/>
    <circle cx="638" cy="331" r="13" fill="#9AA6A2"/>
    <path d="M 632 331 H 644" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/>
    <text x="660" y="336" class="status" fill="#687470">NOT AVAILABLE</text>
    <text x="632" y="376" class="card-title">Formal release</text>
    <text x="632" y="401" class="card-subtitle">No efficacy, safety or GMP claim</text>
  </g>

  <circle cx="241" cy="463" r="6" fill="#2E7B70"/>
  <text x="255" y="468" class="legend">engineering complete</text>
  <circle cx="411" cy="463" r="6" fill="#C08C2E"/>
  <text x="425" y="468" class="legend">in progress</text>
  <circle cx="537" cy="463" r="6" fill="#9AA6A2"/>
  <text x="551" y="468" class="legend">next or planned</text>
</svg>
